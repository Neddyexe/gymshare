<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07130d" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
  <title>Gym Chat Personal</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL AI TRAINER</p>
        <h1>Gym Chat</h1>
      </div>
      <span class="pill" id="profileBadge">NEW</span>
    </header>

    <section id="onboarding" class="panel-card onboarding hidden">
      <div class="hero-copy">
        <p class="eyebrow">WELCOME</p>
        <h2>Let’s build your training profile.</h2>
        <p>Tell Gym Chat what you want to achieve and it will coach around your own stats, schedule and equipment.</p>
      </div>

      <form id="profileForm" class="form-grid">
        <label>Name<input id="name" required maxlength="40" placeholder="e.g. Mia" /></label>
        <div class="two-col">
          <label>Age<input id="age" type="number" min="14" max="100" placeholder="24" /></label>
          <label>Height (cm)<input id="height" type="number" min="120" max="230" placeholder="165" /></label>
        </div>
        <div class="two-col">
          <label>Weight (kg)<input id="weight" type="number" min="35" max="300" step="0.1" placeholder="62" /></label>
          <label>Days / week<select id="days"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
        </div>

        <label>Experience<select id="experience"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></label>

        <fieldset>
          <legend>What do you want to work on?</legend>
          <div class="chip-grid" id="goalChips">
            <label><input type="checkbox" value="fat loss" /> Fat loss</label>
            <label><input type="checkbox" value="muscle gain" /> Muscle gain</label>
            <label><input type="checkbox" value="glutes and legs" /> Glutes + legs</label>
            <label><input type="checkbox" value="upper body" /> Upper body</label>
            <label><input type="checkbox" value="strength" /> Strength</label>
            <label><input type="checkbox" value="cardio" /> Cardio</label>
            <label><input type="checkbox" value="calisthenics" /> Calisthenics</label>
            <label><input type="checkbox" value="general fitness" /> General fitness</label>
          </div>
        </fieldset>

        <label>Equipment<select id="equipment"><option>Full gym</option><option>Home dumbbells</option><option>Bodyweight only</option><option>Mixed</option></select></label>
        <label>Anything to avoid or keep in mind?<textarea id="notes" rows="3" placeholder="Optional: dislikes, limitations, injuries, preferences..."></textarea></label>

        <button class="primary" type="submit">Create my Gym Chat</button>
      </form>
    </section>

    <section id="app" class="hidden">
      <nav class="tabs">
        <button class="tab active" data-tab="coach">Coach</button>
        <button class="tab" data-tab="profile">Profile</button>
        <button class="tab" data-tab="history">History</button>
      </nav>

      <section id="coach" class="panel active">
        <div class="panel-card session-card">
          <div>
            <p class="eyebrow">TODAY</p>
            <h2 id="welcomeTitle">Ready to train?</h2>
            <p id="goalSummary" class="muted"></p>
          </div>
          <button id="startWorkoutBtn" class="primary">Start workout</button>
        </div>

        <div class="panel-card">
          <div id="chatLog" class="chat-log"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" autocomplete="off" placeholder="Tell me how the set went…" />
            <button class="send" type="submit">Send</button>
          </form>
          <button id="voiceBtn" class="secondary" type="button">🎙 Voice</button>
          <p id="voiceStatus" class="muted small"></p>
        </div>
      </section>

      <section id="profile" class="panel">
        <div class="panel-card" id="profileCard"></div>
        <button id="editProfileBtn" class="secondary">Edit profile</button>
        <button id="resetBtn" class="danger">Reset this device</button>
      </section>

      <section id="history" class="panel">
        <div class="panel-card">
          <h2>Recent activity</h2>
          <div id="historyList"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
